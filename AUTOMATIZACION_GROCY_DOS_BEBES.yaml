alias: Bebés - Descontar pañales en Grocy
description: Descuenta la talla activa del bebé que registre un nuevo cambio.
triggers:
  - trigger: state
    entity_id: sensor.habitacion_bebe_bollito_last_change
    attribute: id
    id: bebe_1
  - trigger: state
    entity_id: input_select.bollito_talla_panal
    id: bebe_1
  - trigger: state
    entity_id: sensor.bollito2_last_change
    attribute: id
    id: bebe_2
  - trigger: state
    entity_id: input_select.bollito2_talla_panal
    id: bebe_2
conditions: []
actions:
  - variables:
      clave_bebe: "{{ trigger.id }}"
      nombres:
        bebe_1: Bollito
        bebe_2: Bollito2
      sensores_cambio:
        bebe_1: sensor.habitacion_bebe_bollito_last_change
        bebe_2: sensor.bollito2_last_change
      selectores_talla:
        bebe_1: input_select.bollito_talla_panal
        bebe_2: input_select.bollito2_talla_panal
      memorias:
        bebe_1: input_text.bollito_ultimo_panal_enviado_a_grocy
        bebe_2: input_text.bollito2_ultimo_panal_enviado_a_grocy
      mapa_productos:
        Talla 0: 40
        Talla 1: 41
        Talla 2: 42
        Talla 3: 43
        Talla 4: 44
        Talla 5: 45
        Talla 6: 46
  - variables:
      nombre_bebe: "{{ nombres.get(clave_bebe, clave_bebe) }}"
      sensor_cambio: "{{ sensores_cambio.get(clave_bebe, '') }}"
      selector_talla: "{{ selectores_talla.get(clave_bebe, '') }}"
      memoria: "{{ memorias.get(clave_bebe, '') }}"
  - variables:
      cambio_id: >-
        {{ state_attr(sensor_cambio, 'id')
           | default('', true) | string | trim }}
      ultimo_id: >-
        {{ states(memoria)
           | default('', true) | string | trim }}
      talla: >-
        {{ states(selector_talla)
           | default('', true) | string | trim }}
      producto_id: >-
        {{ mapa_productos.get(
             states(selector_talla) | string | trim,
             0
           ) | int(0) }}
  - if:
      - condition: template
        value_template: >-
          {{ cambio_id in
             ['', 'none', 'None', 'unknown', 'unavailable'] }}
    then:
      - stop: El bebé todavía no tiene un cambio de pañal válido
  - condition: template
    value_template: "{{ cambio_id | int(0) > ultimo_id | int(0) }}"
  - if:
      - condition: template
        value_template: "{{ producto_id == 0 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "bebe_grocy_sin_talla_{{ clave_bebe }}"
          title: Selecciona la talla de pañal
          message: >-
            Se ha registrado el cambio {{ cambio_id }} de {{ nombre_bebe }},
            pero la talla activa es «{{ talla }}». Selecciona la talla en
            {{ selector_talla }}; al cambiarla se reintentará este cambio.
      - stop: No hay talla válida
  - action: rest_command.grocy_consumir_panal
    data:
      product_id: "{{ producto_id }}"
      amount: 1
    response_variable: grocy_respuesta
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ grocy_respuesta.status
                 | default(0, true) | int(0)
                 in [200, 201, 204] }}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ memoria }}"
            data:
              value: "{{ cambio_id }}"
          - delay: "00:00:02"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.grocy_stock_por_ubicacion
          - action: logbook.log
            data:
              name: "Pañales de {{ nombre_bebe }}"
              entity_id: "{{ sensor_cambio }}"
              message: >-
                Descontado 1 pañal de {{ talla }} en Grocy.
                Cambio Baby Buddy: {{ cambio_id }}.
    default:
      - action: persistent_notification.create
        data:
          notification_id: "bebe_grocy_error_{{ clave_bebe }}"
          title: Error al descontar el pañal
          message: >-
            No se pudo consumir un pañal de {{ talla }} para
            {{ nombre_bebe }}. Producto {{ producto_id }}, cambio
            {{ cambio_id }}, HTTP
            {{ grocy_respuesta.status | default('desconocido', true) }}.
mode: queued
max: 10
