name: "Baby Buddy Dashboard ES"
version: "1.2.8-es1"
slug: "baby-buddy-dashboard-es"
description: "Panel en castellano para Baby Buddy con gráficos, temporizadores y registro rápido."
url: "https://github.com/Ceptorshock/baby-buddy-dashboard"
init: false
homeassistant: "2026.4.0"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:baby-face-outline"
panel_title: "Panel Bebe"
panel_admin: false
options:
  baby_buddy_url: ""
  baby_buddy_api_key: ""
  refresh_interval: 30
  demo_mode: false
  unit_system: metric
schema:
  baby_buddy_url: url
  baby_buddy_api_key: password
  refresh_interval: "int(5,300)"
  demo_mode: bool
  unit_system: "list(metric|imperial)"
