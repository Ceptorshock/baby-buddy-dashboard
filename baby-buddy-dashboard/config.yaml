name: "Baby Buddy Dashboard ES"
version: "2.0.9-es18.9"
slug: "baby-buddy-dashboard-es"
description: "Panel en castellano para Baby Buddy con navegación reorganizada en Ahora, Actividad, Salud, Crecimiento y Más; pautas de medicación flexibles, avisos, ajustes de bebés, modo noche, auditoría, calendario, Grocy y Telegram."
url: "https://github.com/Ceptorshock/baby-buddy-dashboard"
init: false
homeassistant: "2026.4.0"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:baby-face-outline"
panel_title: "Bebé"
panel_admin: false
homeassistant_api: true
options:
  baby_buddy_url: ""
  baby_buddy_api_key: ""
  refresh_interval: 30
  demo_mode: false
  unit_system: metric
  default_child_id: 1
  child_names:
    - child_id: 1
      name: Bollito
    - child_id: 2
      name: Bollito2
  shared_room_child_id: 1
  alerts_enabled: true
  night_mode_enabled: true
  night_mode_start: "22:00"
  night_mode_end: "07:00"
  feeding_alert_minutes: 240
  active_timer_alert_minutes: 180
  room_temp_min: 18
  room_temp_max: 27
  diaper_stock_low_threshold: 10
  home_assistant_alert_notifications: true
  mobile_notify_service: ""
  mobile_notify_services: ""
  alexa_notify_service: ""
  alexa_alert_types: "temperature,active_timer"
  telegram_activity_notifications: true
  telegram_chat_id: "-5472345660"
  telegram_activity_types: "timer,feeding,sleep,diaper,tummy,temperature,weight,height,note,pumping,medication"
  calendar_days_ahead: 365
  calendar_max_events: 4
  calendar_full_max_events: 200
  calendar_entities:
    - child_id: 1
      entity_id: calendar.bollito
    - child_id: 2
      entity_id: calendar.bollito2
  grocy_consume_service: rest_command.grocy_consumir_panal
  grocy_restore_service: rest_command.grocy_reponer_panal
  grocy_stock_entity: sensor.grocy_stock_por_ubicacion
  diaper_size_entities:
    - child_id: 1
      entity_id: input_select.bollito_talla_panal
      last_processed_entity: input_text.bollito_ultimo_panal_enviado_a_grocy
    - child_id: 2
      entity_id: input_select.bollito2_talla_panal
      last_processed_entity: input_text.bollito2_ultimo_panal_enviado_a_grocy
  diaper_product_ids:
    - size: Talla 0
      product_id: 40
    - size: Talla 1
      product_id: 41
    - size: Talla 2
      product_id: 42
    - size: Talla 3
      product_id: 43
    - size: Talla 4
      product_id: 44
    - size: Talla 5
      product_id: 45
    - size: Talla 6
      product_id: 46
  room_entities:
    - child_id: 1
      temperature_entity: sensor.termometro_bebe_temperature
      humidity_entity: sensor.termometro_bebe_humidity
      light_entity: switch.interruptor_luz_habitacion_bebe
      window_entity: binary_sensor.sensor_ventana_habitacion_bebe_contact
      camera_entity: camera.camara_bebe
schema:
  baby_buddy_url: url
  baby_buddy_api_key: password
  refresh_interval: "int(5,300)"
  demo_mode: bool
  unit_system: "list(metric|imperial)"
  default_child_id: "int(0,9999)"
  child_names:
    - child_id: int
      name: str
  shared_room_child_id: "int(0,9999)"
  alerts_enabled: bool
  night_mode_enabled: bool
  night_mode_start: str
  night_mode_end: str
  feeding_alert_minutes: "int(15,1440)"
  active_timer_alert_minutes: "int(15,1440)"
  room_temp_min: "float(0,40)"
  room_temp_max: "float(0,40)"
  diaper_stock_low_threshold: "int(0,1000)"
  home_assistant_alert_notifications: bool
  mobile_notify_service: str
  mobile_notify_services: str
  alexa_notify_service: str
  alexa_alert_types: str
  telegram_activity_notifications: bool
  telegram_chat_id: str
  telegram_activity_types: str
  calendar_days_ahead: "int(1,365)"
  calendar_max_events: "int(1,10)"
  calendar_full_max_events: "int(10,500)"
  calendar_entities:
    - child_id: int
      entity_id: str
  grocy_consume_service: str
  grocy_restore_service: str
  grocy_stock_entity: str
  diaper_size_entities:
    - child_id: int
      entity_id: str
      last_processed_entity: str?
  diaper_product_ids:
    - size: str
      product_id: int
  room_entities:
    - child_id: int
      temperature_entity: str?
      humidity_entity: str?
      light_entity: str?
      window_entity: str?
      camera_entity: str?
      diaper_stock_entity: str?
