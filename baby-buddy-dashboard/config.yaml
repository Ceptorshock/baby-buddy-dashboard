name: "Baby Buddy Dashboard ES"
version: "1.2.10-es11"
slug: "baby-buddy-dashboard-es"
description: "Panel en castellano para Baby Buddy con bebé predeterminado, tallas de pañal por bebé, gráficos, temporizadores y registro rápido."
url: "https://github.com/Ceptorshock/baby-buddy-dashboard"
init: false
homeassistant: "2026.4.0"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:baby-face-outline"
panel_title: "Bebé"
panel_admin: false
homeassistant_api: true
options:
  baby_buddy_url: ""
  baby_buddy_api_key: ""
  refresh_interval: 30
  demo_mode: false
  unit_system: metric
  default_child_id: 1
  diaper_size_entities:
    - child_id: 1
      entity_id: input_select.bollito_talla_de_panal
    - child_id: 2
      entity_id: input_select.bollito2_talla_de_panal
schema:
  baby_buddy_url: url
  baby_buddy_api_key: password
  refresh_interval: "int(5,300)"
  demo_mode: bool
  unit_system: "list(metric|imperial)"
  default_child_id: "int(0,9999)"
  diaper_size_entities:
    - child_id: int
      entity_id: str
