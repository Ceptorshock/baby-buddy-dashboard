# IMPORTANTE PARA EL BOTÓN «DESHACER»
# En la automatización que descuenta pañales, sustituye la condición
# que solo comprueba que ambos ID sean diferentes:
#
#   value_template: "{{ cambio_id != ultimo_id }}"
#
# por esta condición numérica:

- condition: template
  value_template: >-
    {{
      cambio_id | int(0)
      >
      ultimo_id | int(0)
    }}

# De esta manera, al borrar el último cambio de Baby Buddy y volver
# temporalmente a un ID anterior, la automatización no descontará otro pañal.
