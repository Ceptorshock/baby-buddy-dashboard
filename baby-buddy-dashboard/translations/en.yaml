configuration:
  baby_buddy_url:
    name: Baby Buddy URL
    description: "Full URL to your Baby Buddy instance (e.g., https://babybuddy.example.com)"
  baby_buddy_api_key:
    name: API Key
    description: "Baby Buddy API token (found in Baby Buddy under Settings > API Key)"
  refresh_interval:
    name: Refresh Interval
    description: "How often (in seconds) the dashboard polls for new data"
  demo_mode:
    name: Demo Mode
    description: "Show mock data without connecting to a Baby Buddy instance"
  unit_system:
    name: Unit System
    description: "Unit labels for measurements (metric: kg, cm, mL, °C — imperial: lb, in, oz, °F)"
  bollito2_enabled:
    name: Bollito2 enabled
    description: "Enable Bollito2 throughout the app. Leave it off until the second child profile is needed."
  disabled_child_ids:
    name: Other disabled children (advanced)
    description: "Comma-separated child IDs the dashboard must ignore completely. Example: 2"
  medication_alert_enabled:
    name: Medication alerts
    description: "Notify when the next medication time is reached according to the recorded interval"
  medication_alert_minutes_before:
    name: Medication alert lead time
    description: "Minutes before the next dose time. Use 0 to notify at the scheduled time"
  diaper_size_entities:
    name: Diaper sizes per child
    description: "Maps each Baby Buddy child ID to its Home Assistant diaper-size input_select helper"
    fields:
      child_id:
        name: Child ID
        description: "Internal Baby Buddy child ID (for example 1 or 2)"
      entity_id:
        name: Size entity
        description: "Home Assistant input_select entity, for example input_select.bollito_talla_panal"
  mobile_notify_services:
    name: Phones for alerts
    description: "Comma-separated mobile notify actions"
  grocy_stock_entity:
    name: Grocy inventory entity
    description: "Sensor with the products attribute used for the active diaper size"
  calendar_entities:
    name: Calendar per child
    description: "Maps each Baby Buddy child_id to a calendar entity"
    fields:
      child_id:
        name: Child ID
        description: "Internal Baby Buddy child ID"
      entity_id:
        name: Calendar entity
        description: "For example calendar.bollito"

