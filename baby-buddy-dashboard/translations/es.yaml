configuration:
  baby_buddy_url:
    name: URL de Baby Buddy
    description: "URL completa de la instancia de Baby Buddy, por ejemplo: http://192.168.1.40"
  baby_buddy_api_key:
    name: Clave API
    description: "Token API de Baby Buddy, disponible en Ajustes > Clave API"
  refresh_interval:
    name: Intervalo de actualización
    description: "Frecuencia, en segundos, con la que el panel consulta nuevos datos"
  demo_mode:
    name: Modo de demostración
    description: "Muestra datos de ejemplo sin conectarse a Baby Buddy"
  unit_system:
    name: Sistema de unidades
    description: "Unidades de medida: métrico (kg, cm, mL, °C) o imperial (lb, in, oz, °F)"
  diaper_size_entities:
    name: Tallas de pañal por bebé
    description: "Relaciona el ID de cada niño de Baby Buddy con su ayudante input_select de talla en Home Assistant"
    fields:
      child_id:
        name: ID del bebé
        description: "ID interno del niño en Baby Buddy (por ejemplo 1 o 2)"
      entity_id:
        name: Entidad de talla
        description: "Entidad input_select de Home Assistant, por ejemplo input_select.bollito_talla_panal"
  mobile_notify_services:
    name: Teléfonos para avisos
    description: "Acciones notify de los móviles separadas por comas, por ejemplo notify.mobile_app_gorka,notify.mobile_app_cris"
  grocy_stock_entity:
    name: Inventario de Grocy
    description: "Sensor con el atributo products usado para calcular el stock de la talla activa"
  calendar_entities:
    name: Calendario por bebé
    description: "Relaciona cada child_id con su entidad de calendario"
    fields:
      child_id:
        name: ID del bebé
        description: "ID interno del niño en Baby Buddy"
      entity_id:
        name: Entidad de calendario
        description: "Por ejemplo calendar.bollito"

