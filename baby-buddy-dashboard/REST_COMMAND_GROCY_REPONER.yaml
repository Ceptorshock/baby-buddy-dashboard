# Añadir dentro del bloque rest_command: existente de configuration.yaml
grocy_reponer_panal:
  url: "http://192.168.1.35:9283/api/stock/products/{{ product_id }}/add"
  method: post
  headers:
    GROCY-API-KEY: !secret grocy_api_key
    Accept: "application/json"
  content_type: "application/json"
  payload: >-
    {
      "amount": {{ amount | default(1) | float }},
      "best_before_date": "2999-12-31",
      "transaction_type": "purchase",
      "price": 0
    }
  timeout: 20
  verify_ssl: false
